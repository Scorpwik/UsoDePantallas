      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#2a1014"/>
  <g filter="url(#blur)">
    <ellipse cx="600" cy="520" rx="480" ry="180" fill="#2b1518"/>
    <rect x="220" y="300" width="760" height="40" rx="8" fill="#3d2024"/>
    <rect x="540" y="340" width="80" height="130" rx="14" fill="#D7001E"/>
    <rect x="548" y="350" width="64" height="90" rx="8" fill="#F5F1EE" opacity=".35"/>
