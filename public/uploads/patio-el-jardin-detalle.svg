<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t2 d2">
  <title id="t2">Detalle de una mesa con pantalla desenfocada</title>
  <desc id="d2">Primer plano de una mesa de patio de comidas. El resplandor de un telefono es visible; las figuras no tienen rostros nitidos.</desc>
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#4a2028"/>
  <g filter="url(#blur)">
    <ellipse cx="600" cy="520" rx="480" ry="180" fill="#6a3840"/>
    <rect x="220" y="300" width="760" height="40" rx="8" fill="#8a5058"/>
    <rect x="540" y="340" width="80" height="130" rx="14" fill="#D7001E"/>
    <rect x="548" y="350" width="64" height="90" rx="8" fill="#F5F1EE" opacity=".55"/>
    <ellipse cx="420" cy="280" rx="90" ry="110" fill="#F5F1EE" opacity=".2"/>
    <ellipse cx="700" cy="260" rx="70" ry="90" fill="#F5F1EE" opacity=".18"/>
    <circle cx="180" cy="120" r="50" fill="#ffd9a0" opacity=".45"/>
  </g>
</svg>
