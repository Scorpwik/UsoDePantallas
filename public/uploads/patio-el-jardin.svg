    <rect x="580" y="360" width="460" height="320" rx="24" fill="#4a242c"/>
    <rect x="1080" y="400" width="400" height="280" rx="24" fill="#523038"/>
    <ellipse cx="760" cy="480" rx="70" ry="90" fill="#F5F1EE" opacity=".28"/>
    <ellipse cx="820" cy="510" rx="40" ry="52" fill="#F5F1EE" opacity=".22"/>
    <rect x="790" y="500" width="36" height="58" rx="8" fill="#D7001E"/>
