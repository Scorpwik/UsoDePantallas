<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t1 d1">
  <title id="t1">Patio de comidas con figuras desenfocadas</title>
  <desc id="d1">Escena de un patio de comidas en interior, con luces calidas y siluetas sin rasgos identificables.</desc>
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a2a32"/>
      <stop offset="1" stop-color="#1c0c10"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <g filter="url(#blur)">
    <rect x="80" y="90" width="1440" height="240" fill="#8a4a3a"/>
    <circle cx="400" cy="170" r="42" fill="#ffd9a0" opacity=".85"/>
    <circle cx="820" cy="150" r="28" fill="#ffd9a0" opacity=".7"/>
    <circle cx="1240" cy="180" r="34" fill="#ffd9a0" opacity=".75"/>
