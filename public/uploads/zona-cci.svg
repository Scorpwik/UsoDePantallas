<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t3 d3">
  <title id="t3">Zona infantil con orillas desenfocadas</title>
  <desc id="d3">ùrea de juegos interior. El centro sugiere movimiento; las orillas muestran siluetas sentadas sin rasgos identificables.</desc>
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <radialGradient id="spot" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#5a1a1c"/>
      <stop offset="1" stop-color="#140808"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#spot)"/>
  <g filter="url(#blur)">
    <ellipse cx="800" cy="560" rx="420" ry="160" fill="#D7001E" opacity=".18"/>
    <rect x="480" y="380" width="640" height="240" rx="80" fill="#ff7a1a" opacity=".12"/>
    <rect x="80" y="620" width="280" height="160" rx="28" fill="#1c1012"/>
    <rect x="1240" y="600" width="280" height="180" rx="28" fill="#1c1012"/>
    <ellipse cx="200" cy="680" rx="36" ry="48" fill="#F5F1EE" opacity=".1"/>
    <rect x="186" y="700" width="28" height="44" rx="6" fill="#FF3B1F"/>
    <ellipse cx="1380" cy="670" rx="50" ry="40" fill="#F5F1EE" opacity=".1"/>
    <ellipse cx="1460" cy="680" rx="40" ry="50" fill="#F5F1EE" opacity=".08"/>
    <rect x="1444" y="690" width="32" height="50" rx="6" fill="#D7001E"/>
  </g>
</svg>
